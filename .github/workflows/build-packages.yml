# 六平台开箱即用包：绿色版 + 安装包（Windows Inno Setup / macOS dmg / Linux deb+rpm）。
#
# 触发：
#   · push 到 expermental / master → 只产出 artifacts（不建 Release）；
#   · 手动 workflow_dispatch → 同上；
#   · 被 upload-release.yml（v* tag）调用 → 产出 artifacts，由调用方发布到 Release。
#
# 平台矩阵（六环境）：
#   win-x64      windows-2022        （顺带发 win-x86 桥）
#   win-arm64    windows-2022        （x64 上交叉发布；x86 桥靠模拟）
#   linux-x64    ubuntu-24.04
#   linux-arm64  ubuntu-24.04-arm    （SDL2 从系统包取一份随包）
#   osx-x64      macos-15-intel
#   osx-arm64    macos-15
#
# 每个包都是 **self-contained**：用户不需要装 .NET。插件桥、CLI、原生库
# （ownvst3 + ysfx）一起装进包里（"开箱即用"）。
#
# 插件原生库的来源：`ExperimentalPatch/InsertHost/Native/<rid>/` 里已提交的
# ownvst3 / ysfx 会由桥工程自动拷到桥 exe 旁边。要更新 ysfx，用
# `.github/workflows/build-ysfx-natives.yml` 手动跑一次，把产物提交回该目录。

name: Build packages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "expermental", "master" ]

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -oP '(?<=<Version>)[^<]+' TuneLab/TuneLab.csproj | head -n1)"
          fi
          [ -n "$v" ] || { echo "cannot resolve version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved version = $v"

  package:
    name: Package ${{ matrix.rid }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2022
            inno_arch: x64
          - rid: win-arm64
            os: windows-2022
            inno_arch: arm64
          - rid: linux-x64
            os: ubuntu-24.04
            inno_arch: ""
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            inno_arch: ""
          - rid: osx-x64
            os: macos-15-intel
            inno_arch: ""
          - rid: osx-arm64
            os: macos-15
            inno_arch: ""

    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ── TuneLab 本体：self-contained + CLI + 桥（自带 ownvst3 / ysfx）──
      - name: Publish TuneLab (self-contained)
        shell: pwsh
        run: |
          dotnet publish TuneLab/TuneLab.csproj -c Release -r $env:RID --self-contained true `
            -p:PublishSingleFile=false -o workspace --nologo
          if ($LASTEXITCODE -ne 0) { throw "app publish failed" }

      - name: Publish CLI into the package
        shell: pwsh
        run: |
          dotnet publish TuneLab.Cli/TuneLab.Cli.csproj -c Release -r $env:RID --self-contained true --nologo
          if ($LASTEXITCODE -ne 0) { throw "cli publish failed" }
          Copy-Item "TuneLab.Cli/bin/Release/net8.0/$env:RID/publish/*" -Destination "workspace/" -Recurse -Force

      - name: Publish isolation bridges
        shell: pwsh
        run: ./tools/publish-bridges.ps1 -Configuration Release -Runtime $env:RID -AppOutput workspace

      - name: Copy license
        shell: pwsh
        run: Copy-Item "LICENSE.txt" -Destination "workspace/"

      # ── linux-arm64：NuGet 的 SDL2 不带 arm64，从系统包取一份随包 ──
      - name: Bundle SDL2 (linux-arm64)
        if: matrix.rid == 'linux-arm64'
        shell: bash
        run: |
          sudo apt-get install -y libsdl2-2.0-0
          cp /usr/lib/aarch64-linux-gnu/libSDL2-2.0.so.0 workspace/libSDL2.so

      # ── 打包：绿色版 + 安装包 ──
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null

          # 绿色版
          Compress-Archive -Path workspace/* -DestinationPath "package/TuneLab-$env:RID-v$env:VERSION.zip"

          # Inno Setup（x64 / arm64 共用一份 iss）
          choco install innosetup -y --no-progress
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }

          & $iscc `
            "/DArch=${{ matrix.inno_arch }}" `
            "/DRid=$env:RID" `
            "/DVersion=$env:VERSION" `
            "/DSourceDir=$((Resolve-Path workspace).Path)" `
            "/DOutputDir=$((Resolve-Path package).Path)" `
            "/DIconFile=$((Resolve-Path TuneLab/Assets/TuneLab.ico).Path)" `
            "CIUtils/innosetup/TuneLab.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }

          Get-ChildItem package | ForEach-Object { Write-Host "  package: $($_.Name)" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x CIUtils/pack-macos.sh
          mkdir -p package
          PAYLOAD_DIR=workspace OUT_DIR=package CIUtils/pack-macos.sh
          ls -l package

      - name: Install nfpm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch="x86_64" ;;
            aarch64) nfpm_arch="arm64" ;;
            *) echo "unsupported machine: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_${nfpm_arch}.tar.gz" \
            | tar -xz nfpm
          chmod +x nfpm

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x CIUtils/pack-linux.sh
          mkdir -p package
          NFPM=./nfpm PAYLOAD_DIR=workspace OUT_DIR=package CIUtils/pack-linux.sh
          ls -l package

      - name: Smoke test (Windows installer + app)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem package -Filter 'TuneLab-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'installer missing from package/' }

          # 静默安装到默认目录（{localappdata}\Programs\TuneLab）。
          Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\TuneLab'
          if (-not (Test-Path "$dir\TuneLab.exe")) { throw "installer did not place TuneLab.exe in $dir" }

          # 文件关联（HKCU ProgID）
          $tlpx = (Get-ItemProperty 'HKCU:\Software\Classes\.tlpx').'(default)'
          if ($tlpx -ne 'TuneLab.Project') { throw ".tlpx association = '$tlpx'" }
          $tlx = (Get-ItemProperty 'HKCU:\Software\Classes\.tlx').'(default)'
          if ($tlx -ne 'TuneLab.Extension') { throw ".tlx association = '$tlx'" }
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\TuneLab.Project\shell\open\command').'(default)'
          if ($cmd -notlike "*$dir\TuneLab.exe*") { throw "project open command = '$cmd'" }

          # 启动：15 秒不退出即视为起来（无音频设备时走退化路径，也应活着）。
          $p = Start-Process "$dir\TuneLab.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "TuneLab exited early (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

          $log = Get-ChildItem (Join-Path $env:APPDATA 'TuneLab\Logs') -Filter '*.log' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $log) { throw 'startup produced no log file' }
          Write-Host "startup log: $($log.FullName)"

          # 卸载：文件与关联都要清掉。
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          if (Test-Path "$dir\TuneLab.exe") { throw 'uninstall left TuneLab.exe behind' }
          if (Test-Path 'HKCU:\Software\Classes\TuneLab.Project') { throw 'uninstall left the .tlpx ProgID behind' }
          Write-Host 'windows smoke passed'

      - name: Smoke test (macOS dmg + app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(ls package/*.dmg | head -1)"
          mnt="$RUNNER_TEMP/tlmnt"
          mkdir -p "$mnt"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mnt"
          cp -R "$mnt/TuneLab.app" "$RUNNER_TEMP/"
          test -L "$mnt/Applications" || { echo "dmg has no Applications symlink"; exit 1; }
          hdiutil detach "$mnt"

          APP="$RUNNER_TEMP/TuneLab.app"
          plutil -p "$APP/Contents/Info.plist" | grep -q 'CFBundleDocumentTypes'
          plutil -p "$APP/Contents/Info.plist" | grep -q 'tlpx'
          test -f "$APP/Contents/Resources/TuneLab.icns"

          "$APP/Contents/MacOS/TuneLab" &
          pid=$!
          sleep 20
          if ! kill -0 $pid 2>/dev/null; then
            echo "TuneLab exited early"
            exit 1
          fi
          kill $pid 2>/dev/null || true
          echo 'macos smoke passed'

      - name: Smoke test (Linux deb + app)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb rpm

          sudo apt-get install -y ./package/*.deb

          test -x /opt/tunelab/TuneLab
          test -x /opt/tunelab/TuneLab.Cli
          test -L /usr/bin/tunelab
          test -f /usr/share/applications/tunelab.desktop
          test -f /usr/share/mime/packages/tunelab.xml
          /opt/tunelab/TuneLab.Cli --help > /dev/null

          # rpm 内容抽查（不安装，避免 Ubuntu 上 rpm 数据库的噪声）。
          rpm -qpl package/*.rpm | grep -q '/opt/tunelab/TuneLab$'

          # GUI 启动：容器里没有音频设备，必须走"退化无音频"而不是崩掉。
          xvfb-run -a /opt/tunelab/TuneLab &
          pid=$!
          sleep 25
          if ! kill -0 $pid 2>/dev/null; then
            echo "TuneLab exited early"
            exit 1
          fi
          kill $pid 2>/dev/null || true

          sudo dpkg -r tunelab
          test ! -e /opt/tunelab/TuneLab
          echo 'linux smoke passed'

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuneLab-${{ matrix.rid }}-v${{ needs.prepare.outputs.version }}
          path: package/*
          if-no-files-found: error
  # Windows ARM64 没有 x64 runner 上的模拟执行能力：用原生 arm64 runner 跑一次绿色版。
  # 这台 runner 只做冒烟（构建仍在 windows-2022 上交叉发布，产物已由上面的 job 验证可打包）。
  smoke-win-arm64:
    name: Smoke win-arm64 (native runner)
    needs: [prepare, package]
    runs-on: windows-11-arm
    steps:
      - name: Download win-arm64 package
        uses: actions/download-artifact@v4
        with:
          name: TuneLab-win-arm64-v${{ needs.prepare.outputs.version }}
          path: pkg

      - name: Run the portable build
        shell: pwsh
        run: |
          Expand-Archive -Path "pkg/TuneLab-win-arm64-v${{ needs.prepare.outputs.version }}.zip" -DestinationPath app
          if (-not (Test-Path "app/TuneLab.exe")) { throw 'portable zip has no TuneLab.exe' }
          if (-not (Test-Path "app/bridge/win-arm64/TuneLab.ExperimentalPatch.VstBridge.arm64.exe")) {
            throw 'arm64 bridge missing'
          }
          if (-not (Test-Path "app/bridge/win-arm64/ysfx.tlhost.dll")) { throw 'ysfx native missing' }

          $p = Start-Process "app/TuneLab.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "TuneLab exited early (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'win-arm64 smoke passed'
