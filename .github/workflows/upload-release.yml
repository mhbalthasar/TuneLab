# v* tag → 六平台开箱即用包 + 安装包进 Release。
#
# 资产清单（每个平台一套）：
#   Windows  : TuneLab-win-x64-v<ver>.zip / TuneLab-Setup-win-x64-v<ver>.exe（Inno，自动更新契约名）
#              TuneLab-win-arm64-v<ver>.zip / TuneLab-Setup-win-arm64-v<ver>.exe
#              TuneLab-Setup-classic-win-x64-v<ver>.exe（自研安装器，保留、供手动安装）
#   macOS    : TuneLab-osx-arm64-v<ver>.tar.gz / .dmg   （拖到 Applications 即安装）
#              TuneLab-osx-x64-v<ver>.tar.gz / .dmg
#   Linux    : TuneLab-linux-x64-v<ver>.tar.gz / .deb / .rpm
#              TuneLab-linux-arm64-v<ver>.tar.gz / .deb / .rpm
#
# 非 tag 的推送只出 artifacts（见 build-packages.yml），不建 Release。

name: Upload release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  call-build:
    name: Build packages
    uses: ./.github/workflows/build-packages.yml
    permissions:
      contents: read

  release:
    name: Publish release
    needs: call-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 自产 release notes：以上一个**已发布 release** 的 tag 为起点（不是上一个 tag ——
      # 调试期的 tag 可能没有 release）。没有历史 release 时退回上一个 tag。
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=""
          if command -v gh >/dev/null 2>&1; then
            prev="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].tag_name' 2>/dev/null || true)"
          fi
          if [ -z "$prev" ]; then
            prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          fi
          if [ -n "$prev" ]; then
            range="$prev..$GITHUB_REF_NAME"
          else
            range="$(git rev-list --max-parents=0 HEAD)..$GITHUB_REF_NAME"
          fi
          echo "range = $range"
          git log --no-merges --format='- %s' "$range" > notes.md
          test -s notes.md || echo '- No changes recorded.' > notes.md

      # 正文是 commit message 拼出来的，反引号很容易混进去。而 1.5.10 / 1.6.0
      # 渲染 Markdown 代码元素会崩溃、老用户一开软件就闪退（见 CIUtils/check-release-notes.py）。
      # 这份文案没人斟酌过，剥掉代码语法不损语义，所以这里直接净化而不是卡住发版；人手编辑
      # 正文那条路由 check-release-notes.yml 硬拦。
      - name: Sanitize release notes
        shell: bash
        run: |
          python3 -m pip install --quiet markdown-it-py
          python3 CIUtils/check-release-notes.py notes.md --fix > notes.safe.md

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TuneLab-*
          merge-multiple: true
          path: dist

      - name: List assets
        shell: bash
        run: ls -lh dist

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TuneLab ${{ github.ref_name }}
          body_path: notes.safe.md
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true

  classic-installer:
    name: Build classic Windows installer
    needs: [call-build, release]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version (strip leading v)
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      # 自研安装器保留：它有自己的更新器语义（-update <dir>），但自动更新的资产名
      # 归 Inno 安装器所有，所以这里用带 classic 的名字发布，避免服务端按名匹配到它。
      - name: Pack classic installer
        shell: pwsh
        run: ./CIUtils/pack-installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Rename for the release
        shell: pwsh
        run: |
          $src = "TuneLab.Setup/bin/installer/TuneLab-Setup-win-x64-v${{ steps.ver.outputs.version }}.exe"
          $dst = "TuneLab.Setup/bin/installer/TuneLab-Setup-classic-win-x64-v${{ steps.ver.outputs.version }}.exe"
          Move-Item $src $dst -Force

      - name: Upload classic installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: TuneLab.Setup/bin/installer/TuneLab-Setup-classic-win-x64-v${{ steps.ver.outputs.version }}.exe
          fail_on_unmatched_files: true